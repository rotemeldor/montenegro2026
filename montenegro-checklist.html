html{scroll-behavior:smooth;}
body{font-family:"Heebo",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:var(--base);}
.top-header{position:fixed;top:0;left:0;right:0;z-index:400;height:var(--top-h);background:var(--charcoal);display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.top-title{font-size:15px;font-weight:700;color:white;flex:1;line-height:1.2;}
.top-title small{display:block;font-weight:300;font-size:11px;color:#A8D5D5;}
.sync-badge{display:flex;align-items:center;gap:4px;font-size:11px;color:rgba(255,255,255,.55);white-space:nowrap;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#4CAF50;animation:pulse 2s infinite;flex-shrink:0;}
.sync-dot.off{background:#E57373;animation:none;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.cat-nav{position:fixed;top:var(--top-h);left:0;right:0;z-index:300;height:var(--cat-h);background:var(--surface);border-bottom:2px solid var(--border);display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;}

.cat-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-size:13px;font-weight:600;color:var(--text-muted);transition:all .18s;flex-shrink:0;gap:1px;-webkit-user-select:none;user-select:none;}
.cat-tab:active{background:var(--teal-pale);}
.cat-tab.active{color:var(--teal);border-bottom-color:var(--teal);background:var(--teal-pale);}
.cat-tab .tab-icon{font-size:20px;}
.cat-tab .tab-name{font-size:12px;font-weight:600;}
.cat-tab .tab-count{font-size:10px;color:var(--text-light);}
.cat-tab.active .tab-count{color:var(--teal);}
.cat-tab.drop-target{background:rgba(42,107,107,.18);border-bottom-color:var(--teal-light);}
.prog-strip{position:fixed;top:calc(var(--top-h) + var(--cat-h));left:0;right:0;z-index:200;background:var(--surface);border-bottom:1px solid var(--border);padding:7px 14px;display:flex;align-items:center;gap:8px;}
.prog-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:var(--green);border-radius:3px;transition:width .4s ease;}
.prog-pct{font-size:13px;font-weight:700;color:var(--green);white-space:nowrap;}
.prog-total{font-size:11px;color:var(--text-light);white-space:nowrap;}
.btn-filter{font-family:"Heebo",sans-serif;font-size:12px;font-weight:600;padding:5px 11px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;}
.btn-filter.on{background:var(--teal-pale);color:var(--teal);border-color:var(--teal-light);}
.content{padding-top:calc(var(--top-h) + var(--cat-h) + var(--strip-h) + 4px);padding-bottom:calc(var(--bar-h) + 16px);}
.cat-section{display:none;}
.cat-section.visible{display:block;}
.cat-section-header{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;}
.csh-icon{font-size:22px;}
.csh-name{font-size:18px;font-weight:700;color:var(--charcoal);flex:1;}
.csh-stats{font-size:13px;color:var(--text-light);}
.btn-del-cat{background:#FEF0EE;border:1.5px solid #E08070;border-radius:8px;color:var(--terracotta);font-size:13px;font-weight:700;cursor:pointer;padding:5px 10px;font-family:"Heebo",sans-serif;white-space:nowrap;}
.items-list{padding:4px 0 8px;}
.item-row{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid rgba(226,221,213,.6);min-height:52px;position:relative;}
.item-row:last-child{border-bottom:none;}
.item-row.dragging{opacity:.35;}

.item-check svg{display:none;}
.item-row[data-state="packed"] .item-check{background:var(--green);border-color:var(--green);}
.item-row[data-state="packed"] .item-check svg{display:block;}
.item-row[data-state="packed"] .item-label{color:var(--green);text-decoration:line-through;text-decoration-color:rgba(46,125,79,.4);}
.item-row[data-state="grey"] .item-label{color:var(--text-muted);}

</head>

    {id:"i55",catId:"c4",text:"\u05de\u05e1\u05db\u05d4 + \u05d0\u05d8\u05de\u05d9 \u05d0\u05d5\u05d6\u05e0\u05d9\u05d9\u05dd \u05dc\u05d8\u05d9\u05e1\u05d4",state:"grey",order:5},
    {id:"i56",catId:"c4",text:"\u05de\u05de\u05ea\u05e7\u05d9\u05dd \u05dc\u05d0\u05d5\u05d6\u05e0\u05d9\u05d9\u05dd \u05d1\u05d8\u05d9\u05e1\u05d4",state:"grey",order:6},
    {id:"i60",catId:"c5",text:"\u05d1\u05d2\u05d3\u05d9\u05dd (7 \u05d9\u05de\u05d9\u05dd)",state:"grey",order:0},
    {id:"i61",catId:"c5",text:"\u05e4\u05d9\u05d2'\u05de\u05d5\u05ea (x2)",state:"grey",order:1},
    {id:"i62",catId:"c5",text:"\u05e0\u05e2\u05dc\u05d9\u05d9\u05dd \u05e0\u05d5\u05d7\u05d5\u05ea",state:"grey",order:2},
    {id:"i63",catId:"c5",text:"\u05db\u05e4\u05db\u05e4\u05d9\u05dd",state:"grey",order:3},
    {id:"i64",catId:"c5",text:"\u05d1\u05d2\u05d3 \u05d9\u05dd",state:"grey",order:4},
    {id:"i65",catId:"c5",text:"\u05db\u05d5\u05d1\u05e2 \u05e9\u05de\u05e9",state:"grey",order:5},
    {id:"i66",catId:"c5",text:"\u05e7\u05e8\u05dd \u05d4\u05d2\u05e0\u05d4 \u05dc\u05d9\u05dc\u05d3\u05d9\u05dd",state:"grey",order:6},
    {id:"i67",catId:"c5",text:"\u05e6\u05e2\u05e6\u05d5\u05e2\u05d9\u05dd / \u05e1\u05e4\u05e8\u05d9\u05dd \u05dc\u05d3\u05e8\u05da",state:"grey",order:7},
    {id:"i68",catId:"c5",text:"\u05d8\u05d0\u05d1\u05dc\u05d8 + \u05d0\u05d5\u05d6\u05e0\u05d9\u05d5\u05ea \u05dc\u05d9\u05dc\u05d3\u05d9\u05dd",state:"grey",order:8},
    {id:"i69",catId:"c5",text:"\u05d7\u05d8\u05d9\u05e4\u05d9\u05dd \u05de\u05d5\u05e2\u05d3\u05e4\u05d9\u05dd",state:"grey",order:9},
    {id:"i70",catId:"c5",text:"\u05d2'\u05e7\u05d8 \u05e7\u05dc \u05dc\u05e6\u05e4\u05d5\u05df",state:"grey",order:10},
    {id:"i71",catId:"c5",text:"\u05de\u05d5\u05e6\u05e5 / \u05e4\u05e8\u05d9\u05d8 \u05e9\u05d9\u05e0\u05d4 \u05de\u05d5\u05db\u05e8",state:"grey",order:11},
    {id:"i72",catId:"c5",text:"\u05d7\u05d9\u05ea\u05d5\u05dc\u05d9\u05dd + \u05de\u05d2\u05d1\u05d5\u05e0\u05d9 \u05dc\u05d7\u05d9\u05dd",state:"grey",order:12},
    {id:"i73",catId:"c5",text:"\u05e7\u05e8\u05dd \u05d4\u05d7\u05ea\u05dc\u05d4",state:"grey",order:13},
    {id:"i74",catId:"c5",text:"\u05db\u05e1\u05d0 \u05d1\u05d8\u05d9\u05d7\u05d5\u05ea / booster",state:"grey",order:14},
    {id:"i80",catId:"c6",text:"\u05ea\u05e8\u05d5\u05e4\u05d5\u05ea \u05e7\u05d1\u05d5\u05e2\u05d5\u05ea",state:"grey",order:0},
    {id:"i81",catId:"c6",text:"\u05d0\u05e7\u05de\u05d5\u05dc / \u05e0\u05d5\u05e8\u05d5\u05e4\u05df \u05d9\u05dc\u05d3\u05d9\u05dd",state:"grey",order:1},
    {id:"i82",catId:"c6",text:"\u05d0\u05e0\u05d8\u05d9\u05d1\u05d9\u05d5\u05d8\u05d9\u05e7\u05d4 \u05e8\u05d6\u05e8\u05d1\u05d4",state:"grey",order:2},
    {id:"i83",catId:"c6",text:"\u05e4\u05dc\u05e1\u05d8\u05e8\u05d9\u05dd + \u05d7\u05d5\u05de\u05e8 \u05d7\u05d9\u05d8\u05d5\u05d9",state:"grey",order:3},
    {id:"i84",catId:"c6",text:"\u05ea\u05e8\u05d5\u05e4\u05d4 \u05e0\u05d2\u05d3 \u05d1\u05d7\u05d9\u05dc\u05d4 \u05d1\u05e0\u05e1\u05d9\u05e2\u05d4",state:"grey",order:4},
    {id:"i85",catId:"c6",text:"\u05de\u05e1\u05de\u05db\u05d9 \u05d1\u05d9\u05d8\u05d5\u05d7 \u05de\u05d5\u05d3\u05e4\u05e1\u05d9\u05dd",state:"grey",order:5},
    {id:"i86",catId:"c6",text:"\u05d2'\u05e7\u05d8 \u05e2\u05d1\u05d4 \u05dc\u05dc\u05d9\u05e0\u05d4 \u05d1\u05d2\u05d5\u05d1\u05d4 (Zabljak)",state:"grey",order:6},
  ]
};

let S={categories:[],items:[]};
let activeCat=null;
let filterOn=false;
let dragItemId=null;

function initSync(){
  const ref=DOC();
  if(!ref){S=JSON.parse(JSON.stringify(DEFAULTS));render();return;}
  ref.onSnapshot(snap=>{
    setSyncOk(true);
    S=snap.exists?snap.data():JSON.parse(JSON.stringify(DEFAULTS));
    if(!snap.exists)save();
    render();
  },()=>{setSyncOk(false);S=JSON.parse(JSON.stringify(DEFAULTS));render();});
}
function setSyncOk(ok){
  document.getElementById("sync-dot").classList.toggle("off",!ok);
  document.getElementById("sync-text").textContent=ok?"\u05de\u05e1\u05d5\u05e0\u05db\u05e8\u05df":"\u05dc\u05d0 \u05de\u05d7\u05d5\u05d1\u05e8";
}
function save(){const ref=DOC();if(ref)ref.set(S).catch(()=>{});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function cats(){return[...S.categories].sort((a,b)=>a.order-b.order);}
function itemsOf(id){return S.items.filter(i=>i.catId===id).sort((a,b)=>a.order-b.order);}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function render(){
  const cs=cats();
  if(!activeCat||!cs.find(c=>c.id===activeCat))activeCat=cs[0]?.id||null;
  renderNav(cs);
  renderContent(cs);
  updateProgress();
}

function renderNav(cs){
  const nav=document.getElementById("cat-nav");
  nav.innerHTML="";
  cs.forEach(c=>{
    const its=itemsOf(c.id);
    const packed=its.filter(i=>i.state==="packed").length;
    const tab=document.createElement("div");
    tab.className="cat-tab"+(c.id===activeCat?" active":"");
    tab.dataset.cat=c.id;
    tab.innerHTML='<span class="tab-icon">'+c.icon+'</span>'
      +'<span class="tab-name">'+esc(c.name)+'</span>'
      +'<span class="tab-count">'+packed+"/"+its.length+'</span>';
    tab.addEventListener("click",()=>switchCat(c.id));
    tab.addEventListener("dragover",e=>{e.preventDefault();tab.classList.add("drop-target");});
    tab.addEventListener("dragleave",()=>tab.classList.remove("drop-target"));
    tab.addEventListener("drop",e=>{e.preventDefault();tab.classList.remove("drop-target");if(dragItemId)moveItemToCat(dragItemId,c.id);});
    nav.appendChild(tab);
  });
  const activeTab=nav.querySelector(".cat-tab.active");
  if(activeTab)activeTab.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
}

function renderContent(cs){
  const con=document.getElementById("cats-container");
  con.innerHTML="";
  cs.forEach(cat=>{
    const its=itemsOf(cat.id);
    const packed=its.filter(i=>i.state==="packed").length;
    const sec=document.createElement("div");
    sec.className="cat-section"+(cat.id===activeCat?" visible":"");
    sec.id="cat-"+cat.id;

    // header
    const hdr=document.createElement("div");
    hdr.className="cat-section-header";
    hdr.innerHTML='<span class="csh-icon">'+cat.icon+'</span>'
      +'<span class="csh-name">'+esc(cat.name)+'</span>'
      +'<span class="csh-stats">'+packed+"/"+its.length+'</span>';
    const delCatBtn=document.createElement("button");
    delCatBtn.className="btn-del-cat";
    delCatBtn.textContent="\u2715 \u05de\u05d7\u05e7";
    delCatBtn.addEventListener("click",()=>deleteCat(cat.id));
    hdr.appendChild(delCatBtn);
    sec.appendChild(hdr);

    // items
    const list=document.createElement("div");
    list.className="items-list";
    if(its.length===0){
      const empty=document.createElement("div");
      empty.style.cssText="padding:20px 14px;font-size:14px;color:var(--text-light);text-align:center;";
      empty.textContent="\u05d0\u05d9\u05df \u05e4\u05e8\u05d9\u05d8\u05d9\u05dd \u2014 \u05d4\u05d5\u05e1\u05e3 \u05dc\u05de\u05d8\u05d4";
      list.appendChild(empty);
    } else {
      its.forEach(it=>{
        list.appendChild(makeItemEl(it));
      });
    }
    sec.appendChild(list);
    con.appendChild(sec);
  });
}

function makeItemEl(it){
  const row=document.createElement("div");
  row.className="item-row";
  row.dataset.id=it.id;
  row.dataset.state=it.state;
  row.draggable=true;

  const chk=document.createElement("div");
  chk.className="item-check";
  chk.innerHTML='<svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4.5l3 3L10 1" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  chk.addEventListener("click",()=>toggle(it.id));

  const lbl=document.createElement("span");
  lbl.className="item-label";
  lbl.textContent=it.text;

  const editBtn=document.createElement("button");
  editBtn.className="item-edit-btn";
  editBtn.title="\u05e2\u05e8\u05d5\u05da";
  editBtn.textContent="\u270f\ufe0f";
  editBtn.addEventListener("click",()=>startEdit(it.id,lbl));

  const moveBtn=document.createElement("button");
  moveBtn.className="item-move-btn";
  moveBtn.title="\u05d4\u05e2\u05d1\u05e8";
  moveBtn.textContent="\u21c4";
  moveBtn.addEventListener("click",()=>openMoveModal(it.id));

  const delBtn=document.createElement("button");
  delBtn.className="item-del-btn";
  delBtn.title="\u05de\u05d7\u05e7";
  delBtn.textContent="\u2715";
  delBtn.addEventListener("click",()=>confirmDelete(it.id));

  row.appendChild(chk);
  row.appendChild(lbl);
  row.appendChild(editBtn);
  row.appendChild(moveBtn);
  row.appendChild(delBtn);

  attachDrag(row);
  return row;
}

function updateProgress(){
  const total=S.items.length;
  const packed=S.items.filter(i=>i.state==="packed").length;
  const pct=total?Math.round(packed/total*100):0;
  document.getElementById("prog-fill").style.width=pct+"%";
  document.getElementById("prog-pct").textContent=pct+"%";
  document.getElementById("prog-total").textContent=packed+"/"+total+" \u05e4\u05e8\u05d9\u05d8\u05d9\u05dd";
}

function switchCat(id){activeCat=id;render();}

function attachDrag(row){
  row.addEventListener("dragstart",e=>{
    dragItemId=row.dataset.id;
    e.dataTransfer.effectAllowed="move";
    setTimeout(()=>row.classList.add("dragging"),0);
  });
  row.addEventListener("dragend",()=>{
    row.classList.remove("dragging");
    document.querySelectorAll(".drop-target,.drop-above").forEach(el=>{
      el.classList.remove("drop-target","drop-above");
    });
    dragItemId=null;
  });
  row.addEventListener("dragover",e=>{
    e.preventDefault();
    document.querySelectorAll(".drop-above").forEach(el=>el.classList.remove("drop-above"));
    row.classList.add("drop-above");
  });
  row.addEventListener("drop",e=>{
    e.preventDefault();
    if(!dragItemId||dragItemId===row.dataset.id)return;
    const src=S.items.find(i=>i.id===dragItemId);
    const tgt=S.items.find(i=>i.id===row.dataset.id);
    if(!src||!tgt||src.catId!==tgt.catId)return;
    const tmp=src.order;src.order=tgt.order;tgt.order=tmp;
    save();render();
  });
}

function toggle(id){
  const it=S.items.find(i=>i.id===id);
  if(!it)return;
  it.state=it.state==="packed"?"grey":"packed";
  save();render();
}

function startEdit(id,lblEl){
  lblEl.contentEditable="true";
  lblEl.focus();
  const range=document.createRange();
  range.selectNodeContents(lblEl);
  range.collapse(false);
  const sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  const done=()=>{
    const t=lblEl.textContent.trim();
    lblEl.contentEditable="false";
    lblEl.removeEventListener("blur",done);
    if(!t){confirmDelete(id);return;}
    const it=S.items.find(i=>i.id===id);
    if(it&&it.text!==t){it.text=t;save();render();}
  };
  lblEl.addEventListener("blur",done);
  lblEl.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();lblEl.blur();}});
}

function confirmDelete(id){
  if(!confirm("\u05dc\u05de\u05d7\u05d5\u05e7 \u05e4\u05e8\u05d9\u05d8 \u05d6\u05d4?"))return;
  S.items=S.items.filter(i=>i.id!==id);
  save();render();
}

function moveItemToCat(id,catId){
  const it=S.items.find(i=>i.id===id);
  if(!it||it.catId===catId)return;
  it.catId=catId;
  const others=S.items.filter(i=>i.catId===catId&&i.id!==id);
  it.order=others.length?Math.max(...others.map(i=>i.order))+1:0;
  activeCat=catId;
  save();render();
}

function openMoveModal(itemId){
  const item=S.items.find(i=>i.id===itemId);
  const con=document.getElementById("move-modal-cats");
  con.innerHTML="";
  cats().filter(c=>c.id!==item.catId).forEach(c=>{
    const btn=document.createElement("button");
    btn.className="move-cat-btn";
    btn.innerHTML='<span style="font-size:20px">'+c.icon+'</span> '+esc(c.name);
    btn.addEventListener("click",()=>{moveItemToCat(itemId,c.id);closeMoveModal();});
    con.appendChild(btn);
  });
  document.getElementById("move-modal").classList.add("open");
}
function closeMoveModal(){document.getElementById("move-modal").classList.remove("open");}

function addItemFromBar(){
  const inp=document.getElementById("bar-inp");
  const text=inp.value.trim();
  if(!text||!activeCat)return;
  const others=S.items.filter(i=>i.catId===activeCat);
  const maxOrd=others.length?Math.max(...others.map(i=>i.order)):-1;
  S.items.push({id:uid(),catId:activeCat,text,state:"grey",order:maxOrd+1});
  inp.value="";
  save();render();
}

function addCat(){
  const inp=document.getElementById("new-cat-inp");
  const name=inp.value.trim();
  if(!name)return;
  const ICONS=["\ud83d\udccb","\ud83e\uddf3","\ud83c\udf92","\ud83d\udc5c","\ud83d\udc57","\ud83d\udc8a","\ud83d\udcf8","\ud83d\udd0c","\ud83c\udfd6","\ud83c\udfbf","\ud83c\udf6b","\ud83e\uddf4"];
  const maxOrd=S.categories.length?Math.max(...S.categories.map(c=>c.order)):-1;
  S.categories.push({id:uid(),name,icon:ICONS[S.categories.length%ICONS.length],order:maxOrd+1});
  inp.value="";
  save();render();
}

function deleteCat(id){
  if(!confirm("\u05dc\u05de\u05d7\u05d5\u05e7 \u05e7\u05d8\u05d2\u05d5\u05e8\u05d9\u05d4 \u05d5\u05db\u05dc \u05d4\u05e4\u05e8\u05d9\u05d8\u05d9\u05dd \u05e9\u05dc\u05d4?"))return;
  S.categories=S.categories.filter(c=>c.id!==id);
  S.items=S.items.filter(i=>i.catId!==id);
  save();render();
}

function toggleFilter(){
  filterOn=!filterOn;
  document.body.classList.toggle("filter-unpacked",filterOn);
  const btn=document.getElementById("filter-btn");
  btn.textContent=filterOn?"\ud83d\udc41 \u05d4\u05db\u05dc":"\ud83d\udc41 \u05d7\u05e1\u05e8\u05d9\u05dd";
  btn.classList.toggle("on",filterOn);
}

document.getElementById("new-cat-inp").addEventListener("keydown",e=>{if(e.key==="Enter")addCat();});
document.getElementById("bar-inp").addEventListener("keydown",e=>{if(e.key==="Enter")addItemFromBar();});

initSync();
</script>
</body>
</html>
