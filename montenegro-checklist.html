<style>
:root {
  --bg: #F5F3EE;
  --surface: #FDFCFA;
  --border: #E2DDD5;
  --teal: #2A6B6B;
  --teal-light: #3D8F8F;
  --teal-pale: #E8F2F2;
  --terracotta: #C4603A;
  --charcoal: #2C2825;
  --text: #1A1210;
  --text-muted: #6B5040;
  --text-light: #9A8878;
  --green: #2E7D4F;
  --grey-col: #B0A898;
  --top-h: 54px;
  --cat-h: 46px;
  --bar-h: 58px;
  --base: 16.5px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body { font-family:'Heebo',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; font-size:var(--base); }

/* ── TOP HEADER ── */
.top-header {
  position:fixed; top:0; left:0; right:0; z-index:400;
  height:var(--top-h);
  background:var(--charcoal);
  display:flex; align-items:center; gap:10px; padding:0 14px;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.top-title { font-size:15px; font-weight:700; color:white; flex:1; line-height:1.2; }
.top-title small { display:block; font-weight:300; font-size:11px; color:#A8D5D5; }
.sync-badge { display:flex; align-items:center; gap:4px; font-size:11px; color:rgba(255,255,255,.55); white-space:nowrap; }
.sync-dot { width:6px; height:6px; border-radius:50%; background:#4CAF50; animation:pulse 2s infinite; flex-shrink:0; }
.sync-dot.off { background:#E57373; animation:none; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.35} }

/* ── CATEGORY NAV BAR ── */
.cat-nav {
  position:fixed; top:var(--top-h); left:0; right:0; z-index:300;
  height:var(--cat-h);
  background:var(--surface);
  border-bottom:2px solid var(--border);
  display:flex; align-items:stretch;
  overflow-x:auto; overflow-y:hidden;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.cat-nav::-webkit-scrollbar { display:none; }
.cat-tab {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:0 14px; cursor:pointer; white-space:nowrap;
  border-bottom:3px solid transparent;
  font-size:13px; font-weight:600; color:var(--text-muted);
  transition:all .18s; flex-shrink:0; gap:1px;
  position:relative; -webkit-user-select:none; user-select:none;
}
.cat-tab:active { background:var(--teal-pale); }
.cat-tab.active { color:var(--teal); border-bottom-color:var(--teal); background:var(--teal-pale); }
.cat-tab .tab-icon { font-size:16px; }
.cat-tab .tab-count { font-size:10px; font-weight:700; color:var(--text-light); }
.cat-tab.active .tab-count { color:var(--teal); }

/* drop highlight on tab */
.cat-tab.drop-target { background:rgba(42,107,107,.18); border-bottom-color:var(--teal-light); }

/* ── PROGRESS STRIP ── */
.progress-strip {
  position:fixed; top:calc(var(--top-h) + var(--cat-h)); left:0; right:0; z-index:200;
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:8px 14px; display:flex; align-items:center; gap:10px;
}
.prog-track { flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.prog-fill { height:100%; background:var(--green); border-radius:3px; transition:width .4s ease; }
.prog-pct { font-size:13px; font-weight:700; color:var(--green); white-space:nowrap; }
.prog-total { font-size:11px; color:var(--text-light); white-space:nowrap; }
.btn-filter {
  font-family:'Heebo',sans-serif; font-size:12px; font-weight:600;
  padding:5px 11px; border-radius:8px; border:1.5px solid var(--border);
  background:var(--surface); color:var(--text-muted); cursor:pointer; white-space:nowrap;
  transition:all .15s; flex-shrink:0;
}
.btn-filter.on { background:var(--teal-pale); color:var(--teal); border-color:var(--teal-light); }

/* ── CONTENT OFFSET ── */
.content {
  padding-top:calc(var(--top-h) + var(--cat-h) + 38px);
  padding-bottom:calc(var(--bar-h) + 16px);
}

/* ── CAT SECTION ── */
.cat-section { display:none; }
.cat-section.visible { display:block; }

.cat-section-header {
  display:flex; align-items:center; gap:8px;
  padding:14px 14px 10px;
}
.csh-icon { font-size:22px; }
.csh-name { font-size:18px; font-weight:700; color:var(--charcoal); flex:1; }
.csh-stats { font-size:13px; color:var(--text-light); }
.btn-add-cat-item {
  font-family:'Heebo',sans-serif; font-size:13px; font-weight:600;
  padding:6px 14px; border-radius:9px; border:none;
  background:var(--teal); color:white; cursor:pointer;
}

/* ── ITEMS ── */
.items-list { padding:4px 0 8px; }

.item-row {
  display:flex; align-items:center; gap:10px;
  padding:12px 14px;
  border-bottom:1px solid rgba(226,221,213,.6);
  transition:background .12s; min-height:52px;
  position:relative;
}
.item-row:last-child { border-bottom:none; }

/* long-press dragging state */
.item-row.lp-dragging {
  background:var(--teal-pale);
  border-radius:10px;
  box-shadow:0 3px 16px rgba(42,107,107,.2);
  z-index:10;
}

/* CHECKBOX */
.item-check {
  width:28px; height:28px; min-width:28px; border-radius:8px;
  border:2px solid var(--border); flex-shrink:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .18s; background:white;
}
.item-check svg { display:none; }
.item-row[data-state="packed"] .item-check { background:var(--green); border-color:var(--green); }
.item-row[data-state="packed"] .item-check svg { display:block; }
.item-row[data-state="packed"] .item-label {
  color:var(--green); text-decoration:line-through;
  text-decoration-color:rgba(46,125,79,.4);
}
.item-row[data-state="grey"] .item-label { color:var(--grey-col); }
.item-row[data-state="grey"] .item-check { border-color:#DDD; opacity:.65; }

.item-label {
  flex:1; font-size:var(--base); color:var(--text);
  transition:color .18s; min-width:0; word-break:break-word;
  outline:none; -webkit-user-select:text; user-select:text;
}

.item-del {
  background:none; border:none; color:var(--text-light);
  font-size:20px; cursor:pointer; padding:4px 6px;
  border-radius:6px; flex-shrink:0; opacity:.3;
  min-width:34px; min-height:34px;
  display:flex; align-items:center; justify-content:center;
  transition:opacity .15s;
}
.item-row:hover .item-del, .item-del:active { opacity:1; color:var(--terracotta); }

/* move button — shown during long-press mode */
.item-move {
  display:none; background:var(--teal); border:none; border-radius:8px;
  color:white; font-family:'Heebo',sans-serif; font-size:12px; font-weight:600;
  padding:5px 10px; cursor:pointer; white-space:nowrap; flex-shrink:0;
}
body.move-mode .item-row.lp-dragging .item-move { display:flex; }

/* MOVE MODE overlay hint on tabs */
body.move-mode .cat-tab { border-bottom-color:rgba(42,107,107,.3); }
body.move-mode .cat-tab::after {
  content:'העבר כאן';
  position:absolute; bottom:2px;
  font-size:9px; color:var(--teal); font-weight:700; letter-spacing:.03em;
}

/* filter */
body.filter-unpacked .item-row[data-state="packed"] { display:none; }

/* ── BOTTOM BAR ── */
.bottom-bar {
  position:fixed; bottom:0; left:0; right:0; z-index:400;
  height:var(--bar-h); background:var(--surface);
  border-top:1px solid var(--border);
  display:flex; align-items:center; gap:8px; padding:0 12px;
  box-shadow:0 -2px 12px rgba(0,0,0,.07);
}
.bottom-bar input {
  flex:1; font-family:'Heebo',sans-serif; font-size:15px;
  padding:9px 12px; border:1.5px solid var(--border);
  border-radius:10px; background:var(--bg); color:var(--text);
  outline:none; text-align:right; min-width:0;
}
.bottom-bar input:focus { border-color:var(--teal); }
.bottom-bar input::placeholder { color:var(--text-light); }
.btn-add {
  width:44px; height:44px; border-radius:50%; border:none;
  background:var(--teal); color:white; font-size:22px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  box-shadow:0 2px 8px rgba(42,107,107,.35); transition:all .15s;
}
.btn-add:active { transform:scale(.93); background:var(--teal-light); }

/* ── ADD CAT ── */
.add-cat-row {
  display:flex; gap:8px; padding:12px 14px 4px;
}
.add-cat-input {
  flex:1; font-family:'Heebo',sans-serif; font-size:14px;
  padding:8px 12px; border:1.5px solid var(--border);
  border-radius:10px; background:var(--surface); color:var(--text);
  outline:none; text-align:right; min-width:0;
}
.add-cat-input:focus { border-color:var(--teal); }
.add-cat-input::placeholder { color:var(--text-light); }
.btn-sm {
  font-family:'Heebo',sans-serif; font-size:13px; font-weight:600;
  padding:8px 14px; border-radius:10px; border:none;
  background:var(--teal); color:white; cursor:pointer; white-space:nowrap;
}

/* MOVE MODAL */
.move-modal {
  display:none; position:fixed; inset:0; z-index:500;
  background:rgba(28,20,16,.55); align-items:flex-end; justify-content:center;
}
.move-modal.open { display:flex; }
.move-modal-box {
  background:var(--surface); border-radius:18px 18px 0 0;
  padding:20px 16px 36px; width:100%; max-width:480px;
}
.move-modal-title {
  font-size:15px; font-weight:700; color:var(--charcoal);
  margin-bottom:14px; text-align:center;
}
.move-cat-btn {
  display:flex; align-items:center; gap:10px;
  width:100%; padding:13px 14px; margin-bottom:8px;
  border:1.5px solid var(--border); border-radius:12px;
  background:var(--bg); cursor:pointer; font-family:'Heebo',sans-serif;
  font-size:15px; font-weight:500; color:var(--text-muted);
  transition:all .15s;
}
.move-cat-btn:active { background:var(--teal-pale); color:var(--teal); border-color:var(--teal); }
.move-cancel {
  width:100%; padding:12px; margin-top:4px;
  border:none; border-radius:12px; background:transparent;
  font-family:'Heebo',sans-serif; font-size:14px; color:var(--text-light);
  cursor:pointer; font-weight:600;
}

::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
</style>
</head>

function initSync(){
  const ref=DOC();
  if(!ref){S=JSON.parse(JSON.stringify(DEFAULTS));render();return;}
  ref.onSnapshot(snap=>{
    setSyncOk(true);
    S=snap.exists?snap.data():JSON.parse(JSON.stringify(DEFAULTS));
    if(!snap.exists)save();
    render();
  },()=>{setSyncOk(false);S=JSON.parse(JSON.stringify(DEFAULTS));render();});
}
function setSyncOk(ok){
  document.getElementById('sync-dot').classList.toggle('off',!ok);
  document.getElementById('sync-text').textContent=ok?'מסונכרן':'לא מחובר';
}
function save(){const ref=DOC();if(ref)ref.set(S).catch(()=>{});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

// ── CATS SORTED ───────────────────────────────────────────────────────────
function cats(){return[...S.categories].sort((a,b)=>a.order-b.order);}
function itemsOf(catId){return S.items.filter(i=>i.catId===catId).sort((a,b)=>a.order-b.order);}

// ── RENDER ────────────────────────────────────────────────────────────────
function render(){
  const cs=cats();
  if(!activeCat||!cs.find(c=>c.id===activeCat)) activeCat=cs[0]?.id||null;
  renderNav(cs);
  renderContent(cs);
  updateProgress();
}

function renderNav(cs){
  const nav=document.getElementById('cat-nav');
  nav.innerHTML=cs.map(c=>{
    const items=itemsOf(c.id);
    const packed=items.filter(i=>i.state==='packed').length;
    return`<div class="cat-tab${c.id===activeCat?' active':''}" 
      data-cat="${c.id}"
      onclick="switchCat('${c.id}')"
      ondragover="event.preventDefault();this.classList.add('drop-target')"
      ondragleave="this.classList.remove('drop-target')"
      ondrop="onTabDrop(event,'${c.id}')">
      <span class="tab-icon">${c.icon}</span>
      <span class="tab-count">${packed}/${items.length}</span>
    </div>`;
  }).join('');
  // scroll active tab into view
  const activeTab=nav.querySelector('.cat-tab.active');
  if(activeTab) activeTab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

function renderContent(cs){
  const con=document.getElementById('cats-container');
  con.innerHTML=cs.map(cat=>{
    const items=itemsOf(cat.id);
    const packed=items.filter(i=>i.state==='packed').length;
    return`<div class="cat-section${cat.id===activeCat?' visible':''}" id="cat-${cat.id}">
      <div class="cat-section-header">
        <span class="csh-icon">${cat.icon}</span>
        <span class="csh-name">${esc(cat.name)}</span>
        <span class="csh-stats">${packed}/${items.length}</span>
        <button class="btn-sm" style="font-size:12px;padding:5px 10px;background:var(--terracotta)" onclick="deleteCat('${cat.id}')">✕</button>
      </div>
      <div class="items-list" id="list-${cat.id}">
        ${items.length===0?'<div style="padding:16px 14px;font-size:14px;color:var(--text-light);text-align:center;">אין פריטים — הוסף למטה</div>':items.map(it=>itemHtml(it)).join('')}
      </div>
    </div>`;
  }).join('');
}

function itemHtml(it){
  return`<div class="item-row" data-id="${it.id}" data-state="${it.state}" draggable="true"
    ondragstart="onItemDragStart(event,'${it.id}')"
    ondragend="onItemDragEnd(event)"
    ondragover="event.preventDefault()"
    ondrop="onItemDrop(event,'${it.id}')">
    <div class="item-check" onclick="toggle('${it.id}')">
      <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
        <path d="M1 4.5l3 3L10 1" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="item-label" contenteditable="true"
      onblur="updateText('${it.id}',this)"
      onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">
      ${esc(it.text)}</span>
    <button class="item-move-btn" onclick="openMoveModal('${it.id}')" title="העבר לקטגוריה">⇄</button>
    <button class="item-del" onclick="deleteItem('${it.id}')">✕</button>
  </div>`;
}

function updateProgress(){
  const total=S.items.length;
  const packed=S.items.filter(i=>i.state==='packed').length;
  const pct=total?Math.round(packed/total*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-total').textContent=packed+'/'+total+' פריטים';
}

// ── NAV ───────────────────────────────────────────────────────────────────
function switchCat(id){
  activeCat=id;
  render();
}

// ── DRAG BETWEEN CATEGORIES (desktop) ─────────────────────────────────────
let dragItemId=null, dragSrcCat=null;
function onItemDragStart(e,id){
  dragItemId=id;
  dragSrcCat=S.items.find(i=>i.id===id)?.catId;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>e.target.classList.add('lp-dragging'),0);
}
function onItemDragEnd(e){
  e.target.classList.remove('lp-dragging');
  document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
  dragItemId=null; dragSrcCat=null;
}
function onTabDrop(e,catId){
  e.preventDefault();
  document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
  if(dragItemId) moveItemToCat(dragItemId,catId);
}
function onItemDrop(e,targetId){
  e.preventDefault();
  if(!dragItemId||dragItemId===targetId) return;
  const src=S.items.find(i=>i.id===dragItemId);
  const tgt=S.items.find(i=>i.id===targetId);
  if(!src||!tgt||src.catId!==tgt.catId) return;
  const tmp=src.order; src.order=tgt.order; tgt.order=tmp;
  save(); render();
}

// ── MOVE MODAL (mobile-friendly move between categories) ──────────────────
function openMoveModal(itemId){
  movingItemId=itemId;
  const item=S.items.find(i=>i.id===itemId);
  const modal=document.getElementById('move-modal');
  const con=document.getElementById('move-modal-cats');
  con.innerHTML=cats()
    .filter(c=>c.id!==item.catId)
    .map(c=>`<button class="move-cat-btn" onclick="moveItemToCat('${itemId}','${c.id}');closeMoveModal()">
      <span style="font-size:20px">${c.icon}</span> ${esc(c.name)}
    </button>`).join('');
  modal.classList.add('open');
}
function closeMoveModal(){
  document.getElementById('move-modal').classList.remove('open');
  movingItemId=null;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────
function toggle(id){
  const it=S.items.find(i=>i.id===id);
  if(!it) return;
  it.state=it.state==='packed'?'grey':'packed';
  save(); render();
}
function updateText(id,el){
  const t=el.textContent.trim();
  const it=S.items.find(i=>i.id===id);
  if(!it) return;
  if(!t){deleteItem(id);return;}
  if(it.text!==t){it.text=t;save();}
}
function deleteItem(id){
  S.items=S.items.filter(i=>i.id!==id);
  save(); render();
}
function moveItemToCat(id,catId){
  const it=S.items.find(i=>i.id===id);
  if(!it||it.catId===catId) return;
  it.catId=catId;
  const others=S.items.filter(i=>i.catId===catId&&i.id!==id);
  it.order=others.length?Math.max(...others.map(i=>i.order))+1:0;
  activeCat=catId;
  save(); render();
}
function addItemFromBar(){
  const inp=document.getElementById('bar-inp');
  const text=inp.value.trim();
  if(!text||!activeCat) return;
  const others=S.items.filter(i=>i.catId===activeCat);
  const maxOrd=others.length?Math.max(...others.map(i=>i.order)):-1;
  S.items.push({id:uid(),catId:activeCat,text,state:'grey',order:maxOrd+1});
  inp.value='';
  save(); render();
}
function addCat(){
  const inp=document.getElementById('new-cat-inp');
  const name=inp.value.trim();
  if(!name) return;
  const ICONS=['📋','🧳','🎒','👜','👗','💊','📸','🔌','🏖','🎿','🍫','🧴'];
  const maxOrd=S.categories.length?Math.max(...S.categories.map(c=>c.order)):-1;
  S.categories.push({id:uid(),name,icon:ICONS[S.categories.length%ICONS.length],order:maxOrd+1});
  inp.value='';
  save(); render();
}
function deleteCat(id){
  if(!confirm('למחוק קטגוריה וכל הפריטים שלה?')) return;
  S.categories=S.categories.filter(c=>c.id!==id);
  S.items=S.items.filter(i=>i.catId!==id);
  save(); render();
}
function toggleFilter(){
  filterOn=!filterOn;
  document.body.classList.toggle('filter-unpacked',filterOn);
  const btn=document.getElementById('filter-btn');
  btn.textContent=filterOn?'👁 הכל':'👁 חסרים';
  btn.classList.toggle('on',filterOn);
}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── ITEM MOVE BUTTON STYLE ─────────────────────────────────────────────────
const style=document.createElement('style');
style.textContent='.item-move-btn{background:none;border:1.5px solid var(--border);border-radius:7px;color:var(--text-light);font-size:15px;cursor:pointer;padding:3px 7px;flex-shrink:0;transition:all .15s;min-width:30px;min-height:30px;display:flex;align-items:center;justify-content:center;}.item-move-btn:active{background:var(--teal-pale);color:var(--teal);border-color:var(--teal);}';
document.head.appendChild(style);

initSync();
</script>
</body>
</html>
